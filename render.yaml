services:
  - type: web
    name: retailscan-ai
    env: python
    region: singapore   # closest to India
    plan: free          # upgrade to starter ($7/mo) to unlock persistent disk
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT

    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DEBUG
        value: "false"
      - key: DATABASE_PATH
        value: /var/data/retail.db   # persistent disk mount point
      - key: CAPTURED_IMAGES_DIR
        value: /var/data/captured_images
      - key: GEMINI_API_KEY_1
        sync: false                  # fill in Render dashboard → Environment
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"

    # Persistent disk — keeps SQLite DB across deploys
    # NOTE: requires Starter plan ($7/mo). On free tier, remove this block
    #       and DB will reset on every redeploy.
    disk:
      name: retailscan-data
      mountPath: /var/data
      sizeGB: 1
