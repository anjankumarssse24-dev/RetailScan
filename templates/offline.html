<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline — RetailScan</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{
            min-height:100vh;
            display:flex;flex-direction:column;
            align-items:center;justify-content:center;
            background:linear-gradient(135deg,#f8f7ff 0%,#ede9fe 100%);
            font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
            padding:24px;
            text-align:center;
        }
        .icon-wrap{
            width:88px;height:88px;border-radius:24px;
            background:linear-gradient(135deg,#6366f1,#8b5cf6);
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 12px 40px rgba(99,102,241,.35);
            margin-bottom:28px;
        }
        .icon-wrap svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
        h1{font-size:1.6rem;font-weight:800;color:#1e1b4b;margin-bottom:10px;}
        p{color:#6b7280;font-size:.95rem;line-height:1.6;max-width:320px;margin-bottom:32px;}
        .cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;margin-bottom:32px;}
        .card{
            background:rgba(255,255,255,.8);border:1px solid rgba(99,102,241,.15);
            border-radius:14px;padding:14px 18px;
            display:flex;align-items:center;gap:14px;
            text-decoration:none;color:inherit;
            font-size:.88rem;font-weight:600;
        }
        .card-icon{width:38px;height:38px;border-radius:10px;background:rgba(99,102,241,.08);
            display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
        .card-sub{font-size:.75rem;font-weight:400;color:#9ca3af;margin-top:2px;}
        .retry-btn{
            background:linear-gradient(135deg,#6366f1,#8b5cf6);
            color:#fff;border:none;border-radius:14px;
            padding:14px 36px;font-size:.92rem;font-weight:700;
            cursor:pointer;box-shadow:0 6px 20px rgba(99,102,241,.35);
            transition:transform .15s,box-shadow .15s;
        }
        .retry-btn:active{transform:scale(.97);box-shadow:0 3px 10px rgba(99,102,241,.25);}
    </style>
</head>
<body>
    <div class="icon-wrap">
        <!-- wifi-off icon -->
        <svg viewBox="0 0 24 24">
            <line x1="1" y1="1" x2="23" y2="23"/>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
            <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1" fill="#fff" stroke="none"/>
        </svg>
    </div>

    <h1>You're Offline</h1>
    <p>No internet connection detected. Your cached pages and cart data are still available below.</p>

    <div class="cards">
        <a href="/" class="card">
            <div class="card-icon">🛒</div>
            <div>
                <div>Scan &amp; Checkout</div>
                <div class="card-sub">Resume your session</div>
            </div>
        </a>
        <a href="/cart" class="card">
            <div class="card-icon">🛍️</div>
            <div>
                <div>My Cart</div>
                <div class="card-sub">Cached items available</div>
            </div>
        </a>
        <a href="/history" class="card">
            <div class="card-icon">📋</div>
            <div>
                <div>Transaction History</div>
                <div class="card-sub">View past purchases</div>
            </div>
        </a>
    </div>

    <button class="retry-btn" onclick="window.location.reload()">
        Retry Connection
    </button>

    <script>
        // Auto-retry when connection is restored
        window.addEventListener("online", () => window.location.reload());
    </script>
</body>
</html>
