<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offers & Discounts — RetailScan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={corePlugins:{preflight:false},theme:{extend:{colors:{primary:{DEFAULT:'#6366f1',dark:'#4f46e5',light:'#e0e7ff'},secondary:'#8b5cf6',accent:'#06b6d4'}}}}</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body>
    <div class="fixed inset-0 overflow-hidden pointer-events-none" style="z-index:-1;">
        <div class="particle particle-1"></div><div class="particle particle-2"></div>
        <div class="particle particle-3"></div><div class="particle particle-4"></div>
        <div class="particle particle-5"></div>
    </div>

    <!-- ████ NAVBAR ████ -->
    <nav class="navbar navbar-expand-md glass-nav sticky-top" style="z-index:1050;">
        <div class="container-xl px-3 px-sm-4">
            <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none py-2" href="/">
                <div class="nav-brand-icon"><i class="fas fa-bolt text-white"></i></div>
                <span class="nav-brand-text">RetailScan</span>
            </a>
            <div class="d-flex align-items-center gap-2 d-md-none">
                <a href="/cart" class="position-relative p-1 text-decoration-none" style="color:var(--text-secondary);">
                    <i class="fas fa-bag-shopping fa-lg"></i>
                    <span id="nav-cart-count-mob" class="cart-badge nav-cart-badge position-absolute"
                          style="top:-4px;right:-6px;font-size:.58rem;padding:1px 5px;min-width:16px;">0</span>
                </a>
                <button class="rs-toggler" type="button"
                        data-bs-toggle="collapse" data-bs-target="#navbarMain"
                        aria-controls="navbarMain" aria-expanded="false">
                    <span class="rs-bar"></span><span class="rs-bar"></span><span class="rs-bar"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse" id="navbarMain" style="visibility:visible;">
                <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-center
                            ms-md-auto gap-1 pt-2 pt-md-0 pb-2 pb-md-0 px-1 px-md-0">
                    <a href="/"        class="rs-nav-link"><i class="fas fa-crosshairs"></i> Scanner</a>
                    <a href="/cart"    class="rs-nav-link"><i class="fas fa-bag-shopping"></i> Cart
                        <span id="nav-cart-count" class="cart-badge nav-cart-badge ms-1">0</span></a>
                    <a href="/history" class="rs-nav-link"><i class="fas fa-clock-rotate-left"></i> History</a>
                    <a href="/payment" class="rs-nav-link"><i class="fas fa-wallet"></i> Pay</a>
                    <a href="/offers"  class="rs-nav-link active"><i class="fas fa-tag"></i> Offers</a>
                </div>
                <!-- Mobile user info -->
                <div class="rs-mobile-user d-md-none">
                    <div class="rs-mobile-user-info">
                        <div id="user-avatar-mob" class="nav-user-avatar flex-shrink-0">
                            <span id="avatar-initials-mob"></span>
                        </div>
                        <div style="min-width:0;">
                            <p id="dropdown-name-mob"  class="mb-0 fw-semibold text-truncate" style="color:var(--text-primary);font-size:.9rem;"></p>
                            <p id="dropdown-email-mob" class="mb-0 text-truncate"              style="color:var(--text-secondary);font-size:.78rem;"></p>
                            <div class="d-flex align-items-center gap-2 mt-1 flex-wrap">
                                <span id="dropdown-tier-badge-mob"></span>
                                <span id="dropdown-reward-points-mob"></span>
                            </div>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="rs-logout-btn">
                        <i class="fas fa-arrow-right-from-bracket"></i> Logout
                    </button>
                </div>
                <!-- Desktop avatar -->
                <div class="d-none d-md-flex align-items-center ms-2 position-relative">
                    <div id="user-avatar" class="nav-user-avatar" onclick="toggleUserDropdown()" title="Account">
                        <span id="avatar-initials"></span>
                    </div>
                    <div id="user-dropdown" class="user-dropdown">
                        <div class="px-4 py-3" style="border-bottom:1px solid rgba(99,102,241,.1);">
                            <p id="dropdown-name"  class="mb-0 fw-semibold" style="color:var(--text-primary);font-size:.875rem;"></p>
                            <p id="dropdown-email" class="mb-0 mt-1"        style="color:var(--text-secondary);font-size:.78rem;"></p>
                            <div class="d-flex align-items-center gap-2 mt-2 flex-wrap">
                                <span id="dropdown-tier-badge"></span>
                                <span id="dropdown-reward-points"></span>
                            </div>
                        </div>
                        <div class="p-1">
                            <a href="/profile" class="user-dropdown-item">
                                <i class="fas fa-user-circle"></i><span>My Profile</span>
                            </a>
                            <button onclick="handleLogout()" class="user-dropdown-item danger w-100">
                                <i class="fas fa-arrow-right-from-bracket"></i><span>Logout</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ████ MOBILE BOTTOM NAV ████ -->
    <nav class="rs-bottom-nav d-md-none">
        <a href="/"       class="rs-bottom-nav-item"><i class="fas fa-crosshairs"></i><span>Scanner</span></a>
        <a href="/cart"   class="rs-bottom-nav-item"><i class="fas fa-bag-shopping"></i><span>Cart</span></a>
        <a href="/history" class="rs-bottom-nav-item"><i class="fas fa-clock-rotate-left"></i><span>History</span></a>
        <a href="/payment" class="rs-bottom-nav-item"><i class="fas fa-wallet"></i><span>Pay</span></a>
        <a href="/offers"  class="rs-bottom-nav-item active"><i class="fas fa-tag"></i><span>Offers</span></a>
    </nav>

    <main class="py-4 py-lg-5 rs-page-main" style="position:relative;z-index:1;">
        <div class="container-xl px-3 px-sm-4">

            <!-- Page header -->
            <div class="mb-5 animate-fade-in-up">
                <div class="d-flex align-items-start justify-content-between flex-wrap gap-3">
                    <div>
                        <h1 class="fw-bold mb-1" style="font-size:clamp(1.5rem,4vw,2.2rem);color:var(--text-primary);">
                            Offers &
                            <span style="background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Discounts</span>
                        </h1>
                        <p class="mb-0" style="color:var(--text-secondary);font-size:.9rem;">All available deals, tier benefits, and promo campaigns.</p>
                    </div>
                    <a href="/cart" class="btn-glow-primary" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px rgba(99,102,241,.3);">
                        <i class="fas fa-bag-shopping me-1"></i> View Cart
                    </a>
                </div>
            </div>

            <!-- ── Your Personalised Discount Summary ── -->
            <div id="personal-summary-wrap" class="hidden mb-5">
                <div class="glass-card p-4 animate-fade-in-up">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="icon-badge icon-badge-primary"><i class="fas fa-user-tag"></i></div>
                        <div>
                            <h2 class="mb-0" style="font-size:1.1rem;">Your Current Cart Summary</h2>
                            <p class="mb-0 rs-text-xs" style="color:var(--text-secondary);">Live discounts applied to your cart</p>
                        </div>
                    </div>
                    <div class="row g-3" id="personal-discount-cards">
                        <!-- Populated by JS -->
                    </div>
                    <div id="personal-smart-msg" class="hidden mt-3 px-3 py-2 rounded-3"
                         style="background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.18);">
                        <p class="mb-0" style="color:var(--primary);font-size:.85rem;font-weight:600;">
                            <i class="fas fa-lightbulb me-1"></i>
                            <span id="personal-smart-text"></span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- ── Category filter tabs ── -->
            <div class="d-flex gap-2 flex-wrap mb-4 animate-fade-in-up">
                <button class="rs-offer-tab active" onclick="filterOffers('all', this)">
                    <i class="fas fa-grid-2"></i> All Offers
                </button>
                <button class="rs-offer-tab" onclick="filterOffers('membership', this)">
                    <i class="fas fa-crown"></i> Membership
                </button>
                <button class="rs-offer-tab" onclick="filterOffers('bulk', this)">
                    <i class="fas fa-layer-group"></i> Bulk
                </button>
                <button class="rs-offer-tab" onclick="filterOffers('cart_value', this)">
                    <i class="fas fa-cart-plus"></i> Cart Value
                </button>
                <button class="rs-offer-tab" onclick="filterOffers('promo', this)">
                    <i class="fas fa-fire"></i> Promos
                </button>
            </div>

            <!-- ── Offer cards grid ── -->
            <div id="offers-grid" class="row g-4 animate-fade-in-up">
                <div class="col-12 text-center py-5">
                    <div class="rs-spinner mx-auto"></div>
                    <p class="mt-3" style="color:var(--text-secondary);">Loading offers…</p>
                </div>
            </div>

            <!-- ── Tier upgrade banner ── -->
            <div id="tier-upgrade-banner" class="hidden mt-5 animate-fade-in-up">
                <div class="glass-card p-4">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="icon-badge icon-badge-amber"><i class="fas fa-chart-line"></i></div>
                        <h2 class="mb-0" style="font-size:1.1rem;">Unlock More Discounts</h2>
                    </div>
                    <div class="row g-3" id="tier-upgrade-cards">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    <script src="{{ url_for('static', filename='js/nav-user.js') }}"></script>
    <script src="{{ url_for('static', filename='js/offers.js') }}"></script>
</body>
</html>
