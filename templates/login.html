<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — RetailScan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={corePlugins:{preflight:false},theme:{extend:{colors:{primary:{DEFAULT:'#6366f1',dark:'#4f46e5',light:'#e0e7ff'},secondary:'#8b5cf6',accent:'#06b6d4'}}}}</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="RetailScan">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/icon-72.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="RetailScan">
    <meta name="msapplication-TileColor" content="#6366f1">
    <meta name="msapplication-TileImage" content="/static/icons/icon-144.png">
<body class="min-vh-100 d-flex align-items-center justify-content-center py-4 px-3">

    <div class="fixed inset-0 overflow-hidden pointer-events-none" style="z-index:-1;">
        <div class="particle particle-1"></div><div class="particle particle-2"></div>
        <div class="particle particle-3"></div><div class="particle particle-4"></div>
        <div class="particle particle-5"></div>
    </div>

    <div class="w-100" style="max-width:440px;position:relative;z-index:1;">

        <!-- Brand hero -->
        <div class="text-center mb-4 animate-fade-in-up">
            <div class="mx-auto mb-3 d-flex align-items-center justify-content-center"
                 style="width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 12px 32px rgba(99,102,241,.45);">
                <i class="fas fa-bolt text-white fa-2x"></i>
            </div>
            <h1 class="fw-extrabold mb-1"
                style="font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
                RetailScan
            </h1>
            <p style="color:var(--text-secondary);">Smart Retail Checkout System</p>
        </div>

        <!-- Card -->
        <div class="glass-card animate-fade-in-up animation-delay-200 overflow-hidden">
            <div style="height:4px;background:linear-gradient(90deg,#6366f1,#8b5cf6,#06b6d4);"></div>
            <div class="p-4 p-md-5">

                <!-- Tab switcher -->
                <div class="d-flex rounded-3 p-1 mb-4" style="background:rgba(99,102,241,.07);">
                    <button id="tab-login"  onclick="switchTab('login')"  class="auth-tab active flex-fill py-2 fw-semibold">Login</button>
                    <button id="tab-signup" onclick="switchTab('signup')" class="auth-tab flex-fill py-2 fw-semibold">Sign Up</button>
                </div>

                <form id="auth-form" onsubmit="return false;" class="d-flex flex-column gap-3">

                    <div id="name-field" class="hidden">
                        <label class="form-label small fw-semibold text-uppercase" style="color:var(--text-secondary);letter-spacing:.5px;">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text auth-input border-end-0"><i class="fas fa-user small" style="color:#94a3b8;"></i></span>
                            <input id="auth-name" type="text" placeholder="John Doe" class="form-control auth-input border-start-0 ps-0">
                        </div>
                    </div>

                    <div>
                        <label class="form-label small fw-semibold text-uppercase" style="color:var(--text-secondary);letter-spacing:.5px;">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text auth-input border-end-0"><i class="fas fa-envelope small" style="color:#94a3b8;"></i></span>
                            <input id="auth-email" type="email" placeholder="you@example.com" required class="form-control auth-input border-start-0 ps-0">
                        </div>
                    </div>

                    <div>
                        <label class="form-label small fw-semibold text-uppercase" style="color:var(--text-secondary);letter-spacing:.5px;">Password</label>
                        <div class="input-group">
                            <span class="input-group-text auth-input border-end-0"><i class="fas fa-lock small" style="color:#94a3b8;"></i></span>
                            <input id="auth-password" type="password" placeholder="••••••••" required minlength="6" class="form-control auth-input border-start-0 ps-0">
                            <button type="button" onclick="togglePassword()" class="input-group-text auth-input border-start-0" style="cursor:pointer;background:#f8faff;">
                                <i id="eye-icon" class="fas fa-eye small" style="color:#94a3b8;"></i>
                            </button>
                        </div>
                    </div>

                    <div id="auth-error" class="hidden text-center py-2 px-3 rounded-3 small fw-semibold"
                         style="background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;"></div>

                    <button id="btn-auth-submit" type="submit" onclick="handleEmailAuth()"
                            class="btn-glow-primary justify-content-center py-3 fw-bold fs-6 mt-1"
                            style="background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 6px 20px rgba(99,102,241,.4);">
                        <i class="fas fa-arrow-right-to-bracket"></i>
                        <span id="btn-auth-text">Login</span>
                    </button>
                </form>

                <div class="d-flex align-items-center gap-3 my-4">
                    <div class="flex-grow-1" style="height:1px;background:rgba(99,102,241,.15);"></div>
                    <span class="small text-uppercase fw-semibold" style="color:var(--text-secondary);letter-spacing:.5px;">or continue with</span>
                    <div class="flex-grow-1" style="height:1px;background:rgba(99,102,241,.15);"></div>
                </div>

                <button id="btn-google" onclick="handleGoogleLogin()"
                        class="w-100 d-flex align-items-center justify-content-center gap-3 py-3 rounded-3 fw-semibold transition-all"
                        style="background:#fff;border:1.5px solid #e0e7ff;color:var(--text-primary);box-shadow:0 2px 8px rgba(99,102,241,.1);cursor:pointer;font-size:.9rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>
            </div>
        </div>

        <p class="text-center small mt-4 animate-fade-in-up animation-delay-400" style="color:var(--text-secondary);">
            <i class="fas fa-shield-check me-1" style="color:var(--success);"></i>
            Secure authentication powered by Firebase
        </p>
    </div>

    <script src="/static/js/loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
    <script src="/static/js/confetti.js"></script>
    <script src="/static/js/shortcuts.js"></script>
</body>
</html>
